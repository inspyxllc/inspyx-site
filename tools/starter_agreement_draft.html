<div><span data-s="name">Home inspection agreement</span><span data-s="words">Home Inspection Agreement

This agreement is between [Your company] (the Inspector), represented by [Your name], license [License number], and [Client name] (the Client), for the inspection of [Property address] on [Inspection date].

1. The inspection. The Inspector will do a visual, non-invasive inspection of the readily accessible systems and parts of the home as they are on the day of the inspection, and will give the Client a written report of what was seen.

2. What it is not. The inspection is not a guarantee, a warranty or an insurance policy. It does not look behind walls, under floors or anywhere not readily accessible, and does not move furniture, stored things or finished surfaces. It is not a code, engineering, mold, pest, radon or environmental inspection unless the Client buys that as its own service.

3. The fee. The Client agrees to pay [Fee] for the inspection. The report is released once the fee is paid.

4. The report. The report is for the Client. The Inspector shares it with others only with the Client's permission, except where the law requires.

5. If something seems missed. The Client agrees to tell the Inspector in writing and to let the Inspector look again before any repair is made, except in an emergency.

6. The whole agreement. This is the whole agreement between the Client and the Inspector. If a part of it can't be enforced, the rest still applies.

Signed by the Client on [Today's date].</span></div>
